# docker-compose.yml — Orquestación de servicios para el Semillero IOT E ITSS.
#
# Define tres servicios:
#   1. postgres  - Base de datos PostgreSQL 16 con healthcheck.
#   2. backend   - API Express compilada en TypeScript, espera a que postgres esté sano.
#   3. frontend  - App React servida por Nginx, depende del backend.
#
# Red: semillero-network (bridge). Volumen persistente para datos de PostgreSQL.

version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: semillero-db
    environment:
      POSTGRES_DB: semillero_iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semillero-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semillero-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/semillero_iot?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      CORS_ORIGIN: http://localhost:5173,http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - semillero-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semillero-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_APP_NAME: Semillero IOT E ITSS
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - semillero-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  semillero-network:
    driver: bridge
