{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://unpkg.com/three@0.178.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">

</head>
<body>

    <!-- navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <img src="{% static 'core/img/logo_semillero.png' %}" 
             class="hero-logo" 
             alt="Semillero"
             class="logo-navbar me-2">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <div class="col-12 mb-4"></div>
            <span>SEMILLERO IOT E ITSS</span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#institucional">Institucional</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#laboratorio">Laboratorio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#blog">Blog</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-info" href="#contacto">Contacto</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- contenido de cada página va aquí -->
    {% block content %}{% endblock %}

    <!-- footer -->
 <footer class="text-center">
        <div class="container">
            <p>&copy; 2026 Semillero IOT - Universidad Piloto de Colombia</p>
            <small>Diseñado para Investigación y Desarrollo</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
